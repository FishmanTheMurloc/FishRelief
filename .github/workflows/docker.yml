name: Docker

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # owner 取自仓库，包名固定；整体小写化后使用
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/fish-relief-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 镜像名必须全小写（owner 可能含大写）
      - name: 镜像名小写化
        id: image
        run: echo "ref=${IMAGE_REF,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            # 默认分支推送 -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # git tag 原样保留
            type=ref,event=tag
            # 每次构建附加 sha-<短哈希>
            type=sha,prefix=sha-,format=short

      - name: 构建并推送（linux/amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
